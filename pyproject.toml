[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worldmem"
version = "0.1.0"
description = "A cognitively inspired hierarchical memory framework for long-term LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26,<3", "openai>=1.60,<3", "jinja2>=3.1,<4", "tqdm>=4.66,<5", "python-dotenv>=1,<2"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
hf = ["torch>=2.4", "transformers>=4.51,<5", "accelerate>=1,<2", "sentence-transformers>=3,<6"]
vllm = ["vllm>=0.8.5"]
dev = ["pytest>=8,<10", "ruff>=0.11", "build>=1,<2"]
eval = ["nltk>=3.8,<4", "rouge-score>=0.1.2,<0.2"]

[project.scripts]
worldmem = "worldmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=outputs/.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
